# Keeps the fork's main-nt10 equal to LiberNT/LiberNT master and merges it into nks.
name: Sync upstream

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: nks-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'nks-hub/LiberNT'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Fast-forward main-nt10 from LiberNT master
        run: |
          upstream=https://github.com/LiberNT/LiberNT.git
          fork="${{ github.server_url }}/$REPO.git"
          upstream_tip=$(git ls-remote --exit-code "$upstream" refs/heads/master | cut -f1)
          fork_tip=$(git ls-remote --exit-code "$fork" refs/heads/main-nt10 | cut -f1)
          if [ "$upstream_tip" = "$fork_tip" ]; then
            echo "main-nt10 is up to date"
            exit 0
          fi

          gh auth setup-git --hostname github.com
          git init --bare "$RUNNER_TEMP/libernt-sync.git"
          cd "$RUNNER_TEMP/libernt-sync.git"
          git fetch --no-tags "$upstream" refs/heads/master
          git push "$fork" FETCH_HEAD:refs/heads/main-nt10

      - name: Merge main-nt10 into nks
        run: |
          set +e
          out=$(gh api -X POST "repos/$REPO/merges" -f base=nks -f head=main-nt10 \
                -f commit_message="chore: merge upstream main-nt10" -i 2>&1)
          set -e
          status=$(printf '%s\n' "$out" | awk 'NR==1 {print $2}')
          echo "merge status: $status"
          case "$status" in
            201) echo "upstream merged into nks" ;;
            204) echo "nks already contains main-nt10" ;;
            409)
              title="Upstream merge conflict"
              if [ -z "$(gh issue list -R "$REPO" --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
                gh issue create -R "$REPO" --title "$title" \
                  --body "Merging main-nt10 into nks conflicts. To merge by hand, run \`git fetch upstream master\`, then \`git checkout nks\` and \`git merge upstream/master\`. See ${{ github.server_url }}/$REPO/actions/runs/${{ github.run_id }}."
              fi
              exit 1 ;;
            *) printf '%s\n' "$out"; exit 1 ;;
          esac

      - name: Disable inherited workflows on this fork
        if: always()
        run: |
          gh api --paginate "repos/$REPO/actions/workflows?per_page=100" \
            --jq '.workflows[] | select(.state == "active" and .path != ".github/workflows/nks-sync-upstream.yml") | .id' |
          while IFS= read -r id; do
            gh api --method PUT "repos/$REPO/actions/workflows/$id/disable"
          done
